name: VEA loader audit

on:
  push:
    paths:
      - '.github/workflows/vea-loader-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Audit loader startup and REST access
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json, urllib.request

          s = Path('index.html').read_text(encoding='utf-8')
          print('=== STATIC AUDIT ===')
          for needle in [
              'async function veaSupabaseLeerPaginaRestMovil',
              'async function veaSupabaseLeerTablaCompleta',
              'async function cargarRepositorioVeaDesdeSupabase',
              'async function veaCacheRestaurarProcesado',
              'const veaDispositivoLimitadoF321',
              'window.onload = async function()'
          ]:
              print(needle, '=>', s.find(needle))

          blocks = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, flags=re.S|re.I)
          print('inline script blocks:', len(blocks))
          for i, block in enumerate(blocks):
              if block.strip():
                  Path(f'/tmp/block_{i}.js').write_text(block, encoding='utf-8')

          def extract_function(name):
              start = s.find(name)
              if start < 0:
                  return ''
              brace = s.find('{', start)
              depth = 0
              in_str = None
              esc = False
              for j in range(brace, len(s)):
                  c = s[j]
                  if in_str:
                      if esc: esc = False
                      elif c == '\\': esc = True
                      elif c == in_str: in_str = None
                      continue
                  if c in ('"', "'", '`'):
                      in_str = c
                      continue
                  if c == '{': depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0:
                          return s[start:j+1]
              return ''

          for name in [
              'async function veaSupabaseLeerPaginaRestMovil',
              'async function veaSupabaseLeerTablaCompleta',
              'async function cargarRepositorioVeaDesdeSupabase',
              'async function veaCacheRestaurarProcesado',
              'window.onload = async function()'
          ]:
              f = extract_function(name)
              print('\n===', name, '===')
              print(f[:22000])

          # Key startup markers / possible early exits.
          print('\n=== STARTUP MARKERS ===')
          for needle in [
              'veaCacheRestaurarProcesado()',
              'cargarRepositorioVeaDesdeSupabase()',
              'return; //',
              'return;',
              'if (cache',
              'veaFirmaRemotaActual',
              'verificarSincronizacion'
          ]:
              hits = [m.start() for m in re.finditer(re.escape(needle), s)]
              print(needle, hits[:30], 'count=', len(hits))

          murl = re.search(r"const\s+VEA_SUPABASE_URL\s*=\s*['\"]([^'\"]+)", s)
          mkey = re.search(r"const\s+VEA_SUPABASE_PUBLISHABLE_KEY\s*=\s*['\"]([^'\"]+)", s)
          if not (murl and mkey):
              raise SystemExit('No se pudieron extraer URL/key públicas de Supabase')
          base, key = murl.group(1), mkey.group(1)
          print('\n=== REST AUDIT ===')
          print('base:', base)
          for table in ['edas','iras','febriles','individual']:
              for offset in [0,300,600]:
                  url = f"{base}/rest/v1/{table}?select=*&offset={offset}&limit=3"
                  req = urllib.request.Request(url, headers={
                      'apikey': key,
                      'Authorization': f'Bearer {key}',
                      'Accept': 'application/json',
                      'User-Agent': 'VEA-loader-audit/2.0'
                  })
                  try:
                      with urllib.request.urlopen(req, timeout=20) as r:
                          data = json.loads(r.read().decode('utf-8'))
                          print(table, 'offset', offset, 'HTTP', r.status, 'rows', len(data))
                  except Exception as e:
                      print(table, 'offset', offset, 'ERROR', repr(e))
          PY

      - name: Check inline JS syntax
        shell: bash
        run: |
          set -e
          found=0
          for f in /tmp/block_*.js; do
            [ -e "$f" ] || continue
            found=1
            echo "Checking $f"
            node --check "$f"
          done
          [ "$found" -eq 1 ]
