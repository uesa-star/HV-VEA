name: Sincronización VEA desde Google Drive

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  sync-vea:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements-sync.txt

      - name: Sincronizar Excel con Supabase
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_DRIVE_FILE_ID: "1oWR_WRJWapAOV29y5XXHIFExLSdgJ-wX"
        run: python scripts/sync_vea.py
