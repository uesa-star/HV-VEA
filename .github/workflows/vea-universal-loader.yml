name: VEA universal multidispositivo

on:
  push:
    paths:
      - '.github/workflows/vea-universal-loader.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar parche
        run: python .github/scripts/vea_universal_patch.py

      - name: Validar sintaxis
        shell: bash
        run: |
          set -e
          node --check api/vea-data.js
          grep -q '/api/vea-data?table=' index.html
          grep -q 'motor universal same-origin vía Vercel' index.html

      - name: Publicar cambios
        shell: bash
        run: |
          rm -f .github/workflows/vea-universal-loader.yml
          rm -f .github/scripts/vea_universal_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/vea-universal-loader.yml .github/scripts/vea_universal_patch.py
          git commit -m "VEA: motor universal de sincronización multidispositivo"
          git push origin HEAD:main
