name: VEA boot universal fix

on:
  push:
    paths:
      - '.github/workflows/vea-boot-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar parche de arranque
        run: python scripts/patch_boot_universal.py
      - name: Validar JavaScript
        shell: bash
        run: |
          node --check api/vea-data.js
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          assert '[VEA F6.01] Arranque universal completado' in s
          assert s.find("await cargarRepositorioVeaDesdeSupabase()") < s.find("veaPasoSeguroF601('cálculos y gráficos'")
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,flags=re.S|re.I)
          for i,b in enumerate(blocks):
              if b.strip(): Path(f'/tmp/boot_{i}.js').write_text(b,encoding='utf-8')
          PY
          for f in /tmp/boot_*.js; do node --check "$f"; done
      - name: Publicar corrección
        shell: bash
        run: |
          rm -f .github/workflows/vea-boot-fix.yml
          rm -f scripts/patch_boot_universal.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/vea-boot-fix.yml scripts/patch_boot_universal.py
          git commit -m "VEA: corregir arranque universal antes del render"
          git push origin HEAD:main
