name: VEA same-origin mobile fix

on:
  push:
    paths:
      - '.github/workflows/vea-same-origin-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch mobile startup and same-origin loader
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          original = s

          def once(old, new, label):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {n}')
              s = s.replace(old, new, 1)
              print('OK', label)

          # 1) Mobile/tablet fetches through Vercel same-origin, eliminating browser CORS/carrier issues.
          once(
              "            const url = `${VEA_SUPABASE_URL}/rest/v1/${encodeURIComponent(tabla)}?select=*&offset=${desde}&limit=${limite}`;",
              "            const url = `/api/vea-data?table=${encodeURIComponent(tabla)}&offset=${desde}&limit=${limite}`;",
              'same-origin URL'
          )

          # 2) Never erase the valid in-memory repository before remote data succeeds.
          once(
              "            limpiarRepositorioVeaEnMemoria();",
              "            // Conserva la última base válida hasta que cada tabla remota haya sido validada.",
              'transactional memory preservation'
          )

          # 3) A failed lightweight signature check must not abort startup on mobile/tablet.
          old = """                } catch (err) {
                    if (txt) txt.textContent = `Sin conexión · usando la última base disponible · ${formatearFechaHoraActualizacionVea(veaUltimaActualizacionDatos)}`;
                    console.warn('[VEA Supabase] Verificación liviana no disponible:', err);
                    return;
                }
"""
          new = """                } catch (err) {
                    if (txt) txt.textContent = `Verificación liviana no disponible · iniciando sincronización completa…`;
                    console.warn('[VEA Supabase] Verificación liviana no disponible; continúa carga completa:', err);
                    // No retornar: continuar con cargarRepositorioVeaDesdeSupabase().
                }
"""
          once(old, new, 'startup fallback without early return')

          # 4) Mobile startup diagnostic status makes the active path visible.
          once(
              "            if (txtEstadoSupabase) txtEstadoSupabase.textContent = modoRestMovil ? 'Cargando datos en modo móvil seguro…' : 'Cargando Dashboard desde Supabase…';",
              "            if (txtEstadoSupabase) txtEstadoSupabase.textContent = modoRestMovil ? 'Cargando datos móviles vía Vercel…' : 'Cargando Dashboard desde Supabase…';",
              'mobile status'
          )

          if s == original:
              raise SystemExit('No changes applied')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate JavaScript and patch markers
        shell: bash
        run: |
          grep -q '/api/vea-data?table=' index.html
          grep -q 'No retornar: continuar con cargarRepositorioVeaDesdeSupabase' index.html
          grep -q 'Conserva la última base válida' index.html
          grep -q 'Cargando datos móviles vía Vercel' index.html
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, flags=re.S|re.I)
          for i,b in enumerate(blocks):
              if b.strip(): Path(f'/tmp/js_{i}.js').write_text(b,encoding='utf-8')
          PY
          for f in /tmp/js_*.js; do node --check "$f"; done

      - name: Commit final fix and cleanup audit workflows
        shell: bash
        run: |
          rm -f .github/workflows/vea-same-origin-fix.yml
          rm -f .github/workflows/vea-loader-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/vea-same-origin-fix.yml .github/workflows/vea-loader-audit.yml
          git commit -m "VEA: corregir sincronización móvil y tablet vía Vercel"
          git push origin HEAD:main
