name: VEA one-shot mobile data fix

on:
  push:
    paths:
      - '.github/workflows/vea-mobile-data-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-mobile-loader:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch VEA mobile/tablet data loader
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          original = text

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: se esperaba 1 coincidencia y se encontraron {count}')
              text = text.replace(old, new, 1)
              print(f'OK: {label}')

          replace_once('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>', '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="this.onerror=null;this.src=\'https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js\'"></script>', 'fallback CDN Supabase')

          pattern_wait = r"        async function esperarSupabaseVea\(maxMs = 4000\) \{\n            const inicio = Date\.now\(\);\n            while \(!window\.supabase\?\.createClient && \(Date\.now\(\) - inicio\) < maxMs\) \{\n                await new Promise\(resolve => setTimeout\(resolve, 150\)\);\n            \}\n            return !!window\.supabase\?\.createClient;\n        \}"
          new_wait = "\n".join([
              "        let veaSupabaseCargaAlternaPromise = null;",
              "        function veaCargarSupabaseAlterno() {",
              "            if (window.supabase?.createClient) return Promise.resolve(true);",
              "            if (veaSupabaseCargaAlternaPromise) return veaSupabaseCargaAlternaPromise;",
              "            veaSupabaseCargaAlternaPromise = new Promise(resolve => {",
              "                const script = document.createElement('script');",
              "                script.src = 'https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js';",
              "                script.async = true;",
              "                let cerrado = false;",
              "                const finalizar = ok => {",
              "                    if (cerrado) return;",
              "                    cerrado = true;",
              "                    clearTimeout(timer);",
              "                    resolve(!!ok);",
              "                };",
              "                const timer = setTimeout(() => finalizar(false), 20000);",
              "                script.onload = () => finalizar(!!window.supabase?.createClient);",
              "                script.onerror = () => finalizar(false);",
              "                document.head.appendChild(script);",
              "            });",
              "            return veaSupabaseCargaAlternaPromise;",
              "        }",
              "",
              "        async function esperarSupabaseVea(maxMs = 20000) {",
              "            const inicio = Date.now();",
              "            while (!window.supabase?.createClient && (Date.now() - inicio) < maxMs) {",
              "                await new Promise(resolve => setTimeout(resolve, 200));",
              "            }",
              "            if (window.supabase?.createClient) return true;",
              "            console.warn('[VEA Supabase] CDN principal lento/no disponible; intentando CDN alterno.');",
              "            return await veaCargarSupabaseAlterno();",
              "        }"
          ])
          text, count = re.subn(pattern_wait, lambda m: new_wait, text, count=1)
          if count != 1:
              raise SystemExit(f'espera y fallback Supabase: se encontraron {count} coincidencias')
          print('OK: espera y fallback Supabase')

          replace_once('            const concurrencia = 3;', '            const concurrencia = veaDispositivoLimitadoF321() ? 1 : 3;', 'concurrencia adaptativa')

          old_range = "                    return veaSupabaseClient.from(tabla).select('*').range(desde, desde + lote - 1);"
          new_range = "\n".join([
              "                    return (async () => {",
              "                        let ultimoError = null;",
              "                        const maxIntentos = veaDispositivoLimitadoF321() ? 4 : 3;",
              "                        for (let intento = 1; intento <= maxIntentos; intento++) {",
              "                            try {",
              "                                const respuesta = await veaSupabaseClient.from(tabla).select('*').range(desde, desde + lote - 1);",
              "                                if (!respuesta.error) return respuesta;",
              "                                ultimoError = respuesta.error;",
              "                            } catch (err) {",
              "                                ultimoError = err;",
              "                            }",
              "                            if (intento < maxIntentos) {",
              "                                const espera = Math.min(5000, 700 * (2 ** (intento - 1)));",
              "                                await new Promise(resolve => setTimeout(resolve, espera));",
              "                            }",
              "                        }",
              "                        return { data: null, error: ultimoError || new Error(`No se pudo leer ${tabla}`) };",
              "                    })();"
          ])
          replace_once(old_range, new_range, 'reintentos por página')

          if text == original:
              raise SystemExit('No se aplicaron cambios')
          path.write_text(text, encoding='utf-8')
          print('index.html actualizado correctamente')
          PY

      - name: Validate patch markers
        shell: bash
        run: |
          grep -q "maxMs = 20000" index.html
          grep -q "concurrencia = veaDispositivoLimitadoF321() ? 1 : 3" index.html
          grep -q "maxIntentos = veaDispositivoLimitadoF321() ? 4 : 3" index.html
          grep -q "unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js" index.html

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/vea-mobile-data-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/vea-mobile-data-fix.yml
          git commit -m "VEA: corregir carga de datos en móvil, tablet y PC"
          git push origin HEAD:main
